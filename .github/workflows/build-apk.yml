name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/mobile/**'
      - 'src/lib/**'
      - 'src/stores/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'capacitor.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'prisma/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21 (required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.postgresql.prisma

      - name: Build static export (mobile)
        env:
          BUILD_MOBILE: '1'
          # Required by next.config.ts: the mobile build must know where the
          # deployed server lives so the exported definition can fetch from it.
          CAPACITOR_SERVER_URL: https://nabdh-almadina.vercel.app
          NEXT_PUBLIC_APP_URL: https://nabdh-almadina.vercel.app
        run: npx next build

      # Capacitor requires an `out/` directory even when the app points at the
      # remote server (see capacitor.config.ts: webDir='out'). The app loads
      # content from https://nabdh-almadina.vercel.app; `out/` here only needs
      # to exist so cap sync can complete. A minimal redirect page is enough.
      - name: Create minimal web bundle (out/)
        run: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Nabd Al-Madina</title>
            <meta http-equiv="refresh" content="0;url=/" />
          </head>
          <body>
            <p>Loading store...</p>
          </body>
          </html>
          EOF

      - name: Sync Capacitor android
        run: npx cap sync android

      # The APK must be signed. We prefer the repository's release keystore if
      # committed; otherwise we generate a CI-only throwaway key so the build
      # pipeline never fails (it just uploads a debug-signed artifact instead).
      - name: Ensure signing keystore exists
        shell: bash
        working-directory: android
        run: |
          PW="${NABD_KEYSTORE_PASSWORD:-android-ci}"
          if [ -f nabd-release-key.jks ]; then
            echo "Using committed release keystore."
          else
            echo "Generating temporary CI-only keystore (fallback password)."
            keytool -genkeypair -v -keystore nabd-release-key.jks \
              -alias nabd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=Nabd Al-Madina, OU=Mobile, O=Nabd Al-Madina, L=Tripoli, ST=Tripoli, C=LY"
          fi
          echo "NABD_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
        env:
          NABD_KEYSTORE_PASSWORD: ${{ secrets.NABD_KEYSTORE_PASSWORD }}

      - name: Build release APK
        working-directory: android
        env:
          NABD_KEYSTORE_PASSWORD: ${{ env.NABD_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
