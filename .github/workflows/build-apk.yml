name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/mobile/**'
      - 'src/lib/**'
      - 'src/stores/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'next.config.ts'
      - 'package.json'
      - 'prisma/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21 (required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.postgresql.prisma

      - name: Build static export (mobile)
        env:
          BUILD_MOBILE: '1'
          # Required by next.config.ts: the mobile build must know where the
          # deployed server lives so the exported definition can fetch from it.
          CAPACITOR_SERVER_URL: https://nabdh-almadina.vercel.app
          NEXT_PUBLIC_APP_URL: https://nabdh-almadina.vercel.app
        run: npx next build

      - name: Sync Capacitor android
        run: npx cap sync android

      # The APK signs with `android/nabd-release-key.jks`, which is not
      # committed to the repo. Without this step the Gradle release build
      # fails at signing. If the file is absent, generate a CI-only key; if
      # it's present (maintainer commit), use it directly.
      - name: Ensure signing keystore exists
        shell: bash
        working-directory: android
        run: |
          if [ -f nabd-release-key.jks ]; then
            echo "Using committed release keystore."
          elif [ -n "${NABD_KEYSTORE_PASSWORD:-}" ]; then
            echo "Generating temporary CI-only keystore (secret-protected)."
            keytool -genkeypair -v -keystore nabd-release-key.jks \
              -alias nabd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$NABD_KEYSTORE_PASSWORD" -keypass "$NABD_KEYSTORE_PASSWORD" \
              -dname "CN=Nabd Al-Madina, OU=Mobile, O=Nabd Al-Madina, L=Tripoli, ST=Tripoli, C=LY"
          else
            echo "::error::NABD_KEYSTORE_PASSWORD secret is not set, cannot sign the release APK."
            exit 1
          fi
        env:
          NABD_KEYSTORE_PASSWORD: ${{ secrets.NABD_KEYSTORE_PASSWORD }}

      - name: Build release APK
        working-directory: android
        env:
          NABD_KEYSTORE_PASSWORD: ${{ secrets.NABD_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
